plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist.
        // Xiaomi: docs/devices/xiaomi-mitv-aetp0-dofus.md (com.ts.launcher).
        // ColorOS TV: docs/devices/oppo-k9-55-oppocnm632.md (com.oneplus.tv.launcher2).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('dev.lumax.nativepreview')
        minSdk 26
        targetSdk 34
        versionCode 49
        versionName '0.2.35-native-preview'
    }

    signingConfigs {
        // The key every released LumaX APK is signed with, kept outside the repository
        // (see docs in README). Android installs an update only over the same key.
        release {
            def store = providers.gradleProperty('LUMAX_RELEASE_STORE_FILE').getOrNull()
            if (store != null) {
                storeFile file(store)
                storePassword providers.gradleProperty('LUMAX_RELEASE_STORE_PASSWORD').get()
                keyAlias providers.gradleProperty('LUMAX_RELEASE_KEY_ALIAS').get()
                keyPassword providers.gradleProperty('LUMAX_RELEASE_KEY_PASSWORD').get()
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Without the release key (e.g. another developer's machine), fall back to the
            // debug key; such builds cannot update an installed release.
            signingConfig providers.gradleProperty('LUMAX_RELEASE_STORE_FILE').isPresent() ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.neovisionaries:nv-websocket-client:2.14'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // Android's unit-test stubs leave org.json unimplemented; use the real library in tests.
    testImplementation 'org.json:json:20240303'
}
